name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Syntax and package checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Show the toolchain
        run: |
          node --version || { echo "::error title=step:toolchain::node --version failed"; exit 1; }
          npm --version || { echo "::error title=step:toolchain::npm --version failed"; exit 1; }
          pwd
          ls -la

      - name: Parse every shipped JavaScript file and validate the manifest
        run: node scripts/check.mjs || { echo "::error title=step:self-check::scripts/check.mjs failed"; exit 1; }

      - name: Pack the bundle
        run: |
          mkdir -p dist
          npm pack --pack-destination dist || { echo "::error title=step:pack::npm pack failed"; exit 1; }
          ls -l dist

      - name: Show tarball contents
        run: |
          set -e
          ls -l dist
          tar -tzf dist/*.tgz | sed 's/^/  /' || { echo "::error title=step:tarball::tar listing failed"; exit 1; }

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: dsh-shared-browser-tarball
          path: dist/*.tgz
          if-no-files-found: error
