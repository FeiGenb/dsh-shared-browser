name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Syntax and package checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Show the toolchain
        run: |
          node --version
          npm --version
          pwd
          ls -la

      - name: Parse every shipped JavaScript file and validate the manifest
        run: node scripts/check.mjs

      - name: Pack the bundle
        run: npm pack --pack-destination dist

      - name: Show tarball contents
        run: tar -tzf dist/*.tgz | sed 's/^/  /'

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: dsh-shared-browser-tarball
          path: dist/*.tgz
          if-no-files-found: error
