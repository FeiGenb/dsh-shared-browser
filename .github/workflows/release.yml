name: Release and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag, release and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      - name: Read name and version
        id: meta
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already released - nothing to publish"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "releasing $NAME@$VERSION"
          fi

      - name: Pack the bundle
        if: steps.meta.outputs.new == 'true'
        run: |
          set -euo pipefail
          npm pack --pack-destination dist
          ls -l dist

      - name: Create GitHub Release
        if: steps.meta.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: dist/*.tgz
          fail_on_unmatched_files: true

      - name: Publish to npm
        if: steps.meta.outputs.new == 'true' && secrets.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TGZ=$(ls dist/*.tgz | head -n 1)
          echo "publishing $TGZ"
          npm publish "$TGZ" --access public --provenance=false

      - name: Skip npm publish (no token)
        if: steps.meta.outputs.new == 'true' && secrets.NPM_TOKEN == ''
        run: |
          echo "::notice title=npm skipped::Add the NPM_TOKEN repository secret (token with publish permission and 2FA bypass) to publish to npm from CI."

      - name: Publish to GitHub Packages (scoped names only)
        if: steps.meta.outputs.new == 'true' && startsWith(steps.meta.outputs.name, '@')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TGZ=$(ls dist/*.tgz | head -n 1)
          npm publish "$TGZ" --registry=https://npm.pkg.github.com --access public
