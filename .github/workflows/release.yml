name: Release and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag, release and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Read name and version
        id: meta
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already released - nothing to publish"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "releasing $NAME@$VERSION"
          fi

      - name: Pack the bundle
        if: steps.meta.outputs.new == 'true'
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          ls -l dist

      - name: Create GitHub Release
        if: steps.meta.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: dist/*.tgz
          fail_on_unmatched_files: true

      - name: Publish to npm
        if: steps.meta.outputs.new == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice title=npm publish skipped::The NPM_TOKEN repository secret is not set. Add a token with publish permission and 2FA bypass to publish from CI; the GitHub Release above already carries the tarball."
            exit 0
          fi
          set -euo pipefail
          TGZ=$(ls dist/*.tgz | head -n 1)
          echo "publishing $TGZ"
          npm publish "$TGZ" --access public --provenance=false

      # GitHub Packages only accepts scoped package names, so the tarball that was
      # just packed is unpacked, renamed to @feigenb/<name> and published there too.
      # Auth is the workflow GITHUB_TOKEN (packages: write). setup-node only writes
      # credentials for registry.npmjs.org, so the npm.pkg.github.com auth line is
      # appended here; that is the usual cause of a 401/403 on this registry.
      - name: Publish a scoped mirror to GitHub Packages
        if: steps.meta.outputs.new == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ steps.meta.outputs.name }}
        run: |
          set -euo pipefail
          case "$PKG_NAME" in
            @*) SCOPED="$PKG_NAME" ;;
            *)   SCOPED="@feigenb/$PKG_NAME" ;;
          esac
          SCOPE=$(printf '%s' "$SCOPED" | sed 's#^\(@[^/]*\)/.*#\1#')
          SCOPED=$(printf '%s' "$SCOPED" | tr '[:upper:]' '[:lower:]')
          echo "mirror target: $SCOPED (scope $SCOPE)"
          {
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}";
            echo "${SCOPE}:registry=https://npm.pkg.github.com";
          } >> "$HOME/.npmrc"
          WORK=$(mktemp -d)
          tar -xzf dist/*.tgz -C "$WORK"
          cd "$WORK/package"
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = process.argv[1];
            pkg.publishConfig = Object.assign({}, pkg.publishConfig, {
              registry: "https://npm.pkg.github.com",
              access: "public"
            });
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log("mirror package:", pkg.name, pkg.version);
          ' "$SCOPED"
          mkdir -p "$WORK/out"
          npm pack --pack-destination "$WORK/out"
          ls -l "$WORK/out"
          npm publish "$WORK"/out/*.tgz --registry=https://npm.pkg.github.com --access public
          echo "::notice title=GitHub Packages::published $SCOPED@${{ steps.meta.outputs.version }}"
