name: Release and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# id-token: write is required for npm trusted publishing (OIDC).
# packages: write is required for the GitHub Packages mirror.
permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Tag, release and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # No registry-url here on purpose: setup-node would write a
      # ``:_authToken=${NODE_AUTH_TOKEN}`` line into .npmrc, and an unset
      # variable breaks the OIDC publish path.
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@^11
          npm --version

      - name: Read name and version
        id: meta
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already released - nothing to publish"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "releasing $NAME@$VERSION"
          fi

      - name: Pack the bundle
        if: steps.meta.outputs.new == 'true'
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          ls -l dist

      - name: Create GitHub Release
        if: steps.meta.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: v${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: dist/*.tgz
          fail_on_unmatched_files: true

      # npm trusted publishing: npm exchanges the Actions OIDC token for a
      # short-lived registry credential, so no long-lived npm token is needed.
      # The NPM_TOKEN secret is still used as a fallback if the OIDC handshake
      # fails, so a connection problem never blocks a release.
      #
      # The tarball is passed as an absolute path: npm 11 parses a bare relative
      # "dist/foo.tgz" as a GitHub shorthand spec (owner/repo) and tries to clone
      # it over ssh, which fails with a confusing "Permission denied (publickey)".
      - name: Publish to npm
        if: steps.meta.outputs.new == 'true'
        env:
          FALLBACK_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -uo pipefail
          TGZ="$PWD/$(ls dist/*.tgz | head -n 1)"
          LOG="$RUNNER_TEMP/npm-publish.log"
          echo "publishing $TGZ"
          if npm publish "$TGZ" --registry=https://registry.npmjs.org/ --access public --loglevel verbose >"$LOG" 2>&1; then
            cat "$LOG"
            echo "::notice title=npm::published ${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }} via OIDC trusted publishing"
            exit 0
          fi
          echo "----- OIDC publish failed (last 40 lines) -----"
          tail -n 40 "$LOG" || true
          MSG=$(grep -i 'npm error' "$LOG" | grep -v 'complete log of this run' | head -n 5 | tr '\n' ' | ' | cut -c1-600)
          echo "::warning title=OIDC publish failed::${MSG:-no npm error line}"
          if [ -z "${FALLBACK_TOKEN:-}" ]; then
            echo "::error title=npm publish failed::OIDC publish failed and the NPM_TOKEN secret is not set"
            exit 1
          fi
          echo "retrying with the NPM_TOKEN secret"
          NPMRC="$RUNNER_TEMP/npmrc"
          umask 077
          printf 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n' "$FALLBACK_TOKEN" > "$NPMRC"
          if npm publish "$TGZ" --userconfig "$NPMRC" --registry=https://registry.npmjs.org/ --access public --loglevel verbose >"$LOG.fallback" 2>&1; then
            tail -n 20 "$LOG.fallback"
            echo "::notice title=npm::published ${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }} with the NPM_TOKEN fallback"
          else
            echo "----- token publish failed (last 40 lines) -----"
            tail -n 40 "$LOG.fallback" || true
            MSG=$(grep -i 'npm error' "$LOG.fallback" | grep -v 'complete log of this run' | head -n 5 | tr '\n' ' | ' | cut -c1-600)
            echo "::error title=npm publish failed::${MSG:-npm publish failed}"
            exit 1
          fi

      # GitHub Packages only accepts scoped package names, so the tarball that was
      # just packed is unpacked, renamed to @feigenb/<name> and published there too.
      # Auth is the workflow GITHUB_TOKEN (packages: write); a dedicated npmrc is
      # passed with --userconfig so no environment-level npm config can override it.
      - name: Publish a scoped mirror to GitHub Packages
        if: steps.meta.outputs.new == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ steps.meta.outputs.name }}
        run: |
          set -euo pipefail
          case "$PKG_NAME" in
            @*) SCOPED="$PKG_NAME" ;;
            *)   SCOPED="@feigenb/$PKG_NAME" ;;
          esac
          SCOPE=$(printf '%s' "$SCOPED" | sed 's#^\(@[^/]*\)/.*#\1#')
          SCOPED=$(printf '%s' "$SCOPED" | tr '[:upper:]' '[:lower:]')
          echo "mirror target: $SCOPED (scope $SCOPE)"
          WORK=$(mktemp -d)
          NPMRC="$WORK/npmrc"
          umask 077
          printf '//npm.pkg.github.com/:_authToken=%s\n%s:registry=https://npm.pkg.github.com\n' \
            "$NODE_AUTH_TOKEN" "$SCOPE" > "$NPMRC"
          echo "npm userconfig: $NPMRC (auth line present: $(grep -c '_authToken' "$NPMRC"))"
          tar -xzf dist/*.tgz -C "$WORK"
          cd "$WORK/package"
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = process.argv[1];
            pkg.publishConfig = Object.assign({}, pkg.publishConfig, {
              registry: "https://npm.pkg.github.com",
              access: "public"
            });
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
            console.log("mirror package:", pkg.name, pkg.version);
          ' "$SCOPED"
          mkdir -p "$WORK/out"
          npm pack --pack-destination "$WORK/out" --userconfig "$NPMRC"
          ls -l "$WORK/out"
          LOG="$WORK/out/npm-publish.log"
          if npm publish "$WORK"/out/*.tgz \
              --userconfig "$NPMRC" \
              --registry=https://npm.pkg.github.com \
              --access public \
              --loglevel verbose >"$LOG" 2>&1; then
            cat "$LOG"
            echo "::notice title=GitHub Packages::published $SCOPED@${{ steps.meta.outputs.version }}"
          else
            echo "----- npm publish log (last 60 lines) -----"
            tail -n 60 "$LOG" || true
            echo "----- end of log -----"
            MSG=$(grep -i 'npm error' "$LOG" | grep -v 'A complete log of this run can be found' | head -n 6 | tr '\n' ' | ' | cut -c1-600)
            [ -n "$MSG" ] || MSG=$(tail -n 4 "$LOG" | tr '\n' ' | ' | cut -c1-600)
            echo "::error title=GitHub Packages publish failed::$MSG"
            exit 1
          fi
