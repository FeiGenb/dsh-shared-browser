name: Smoke

on:
  push:
    paths:
      - 'smoke/**'
  workflow_dispatch:

jobs:
  hello:
    name: Smoke run step
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node version
        run: node --version
      - name: Shell and files
        run: |
          echo "shell ok"
          pwd
          ls -la
          bash --version | head -n 1
